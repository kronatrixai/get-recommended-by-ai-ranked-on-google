<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Get Recommended by AI & Ranked on Google | Kronatrix</title>
  <meta name="description" content="Send Kronatrix what you have. We figure out what needs fixing, then recommend the right website, pages, support sites or visibility build to help you get recommended by AI and ranked on Google." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#05070d" />
  <link rel="canonical" href="https://kronatrix.co.uk/" />
  <link rel="icon" type="image/png" href="kronatrix-ai-logo.png" />
  <link rel="apple-touch-icon" href="kronatrix-ai-logo.png" />

  <meta property="og:title" content="Get Recommended by AI & Ranked on Google | Kronatrix" />
  <meta property="og:description" content="You do not need to know every answer. Send what you have. Kronatrix will figure out what needs fixing." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="spencer-aurelius.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root{
      --bg:#03050a;
      --card:#0b101c;
      --line:rgba(255,255,255,.15);
      --text:#ffffff;
      --muted:#b9c6dc;
      --blue:#18a9ff;
      --orange:#ff8a1c;
      --gold:#ffd45a;
      --radius:24px;
      --shadow:0 30px 85px rgba(0,0,0,.58);
    }
    *{box-sizing:border-box}
    html{height:100%;scroll-behavior:smooth}
    body{
      min-height:100%;
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% -8%, rgba(24,169,255,.20), transparent 31rem),
        radial-gradient(circle at 50% 100%, rgba(255,138,28,.13), transparent 35rem),
        linear-gradient(180deg,#050914 0%, var(--bg) 58%, #020306 100%);
      display:grid;
      place-items:center;
      padding:clamp(12px,3vw,34px);
    }
    .wrap{width:min(760px,100%)}
    .panel{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(13,19,33,.95), rgba(8,11,17,.97));
      box-shadow:var(--shadow);
      padding:clamp(14px,3vw,28px);
      isolation:isolate;
    }
    .panel::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:radial-gradient(circle at 50% 8%, rgba(24,169,255,.16), transparent 22rem);
      pointer-events:none;
      z-index:-1;
    }
    .brand{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
      letter-spacing:.18em;
      font-size:14px;
      font-weight:950;
      text-transform:uppercase;
      color:#d9e9ff;
    }
    .brand img{
      width:40px;
      height:40px;
      border-radius:50%;
      object-fit:cover;
      filter:drop-shadow(0 0 18px rgba(24,169,255,.65));
    }
    .hero-img{
      display:block;
      width:min(290px,70vw);
      height:auto;
      max-height:390px;
      object-fit:contain;
      margin:0 auto 12px;
      filter:drop-shadow(0 24px 36px rgba(0,0,0,.58)) drop-shadow(0 0 20px rgba(24,169,255,.18));
    }
    .audio-box{
      border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(255,255,255,.058),rgba(255,255,255,.027));
      border-radius:20px;
      padding:14px;
      margin-bottom:10px;
      text-align:center;
    }
    h1{
      margin:0 0 5px;
      font-size:clamp(24px,4.9vw,40px);
      line-height:1.02;
      letter-spacing:-.055em;
      text-wrap:balance;
    }
    .micro{
      margin:0 0 10px;
      color:#c9dcff;
      font-size:clamp(13px,2.7vw,15px);
      font-weight:720;
    }
    audio{width:100%;display:block;accent-color:var(--orange)}
    form{display:grid;gap:10px;margin-top:10px}
    .form-note{
      margin:0;
      padding:11px 12px;
      border:1px solid rgba(24,169,255,.22);
      border-radius:15px;
      background:rgba(24,169,255,.075);
      color:#dcecff;
      font-size:13px;
      line-height:1.38;
      font-weight:760;
      text-align:center;
    }
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    input,select,textarea,button{
      width:100%;
      border:1px solid rgba(255,255,255,.15);
      border-radius:14px;
      font:inherit;
      outline:none;
    }
    input,select,textarea{
      color:var(--text);
      background:rgba(255,255,255,.075);
      padding:14px;
      min-height:48px;
    }
    select{appearance:none;color:#d8e3f4}
    textarea{min-height:104px;resize:vertical;line-height:1.45}
    input::placeholder,textarea::placeholder{color:#aeb8c8;opacity:1}
    input:focus,select:focus,textarea:focus{
      border-color:rgba(24,169,255,.84);
      box-shadow:0 0 0 4px rgba(24,169,255,.16);
      background:rgba(255,255,255,.095);
    }
    .hidden{position:absolute;left:-9999px;opacity:0;pointer-events:none}
    .consent{
      display:flex;
      gap:10px;
      align-items:flex-start;
      color:#b9c6dc;
      font-size:12px;
      line-height:1.35;
      padding:2px 2px 0;
    }
    .consent input{width:18px;min-height:18px;height:18px;margin-top:0;accent-color:var(--orange);padding:0;flex:0 0 auto}
    .cta{
      min-height:57px;
      border:0;
      cursor:pointer;
      color:#05070d;
      background:linear-gradient(90deg,var(--orange),var(--gold));
      font-weight:1000;
      letter-spacing:-.02em;
      box-shadow:0 18px 38px rgba(255,138,28,.24);
      transition:transform .16s ease, filter .16s ease, opacity .16s ease;
    }
    .cta:hover{transform:translateY(-1px);filter:saturate(1.08)}
    .cta:active{transform:translateY(0)}
    .cta:disabled{opacity:.72;cursor:not-allowed;transform:none}
    .status{min-height:18px;text-align:center;color:#d6e7ff;font-size:13px;font-weight:800}
    footer{
      text-align:center;
      color:#aeb8c8;
      font-size:13px;
      margin:12px auto 0;
    }
    footer a{color:#fff;font-weight:950;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45)}
    footer a:hover{color:var(--gold)}
    .sr-only{
      position:absolute!important;
      width:1px!important;
      height:1px!important;
      padding:0!important;
      margin:-1px!important;
      overflow:hidden!important;
      clip:rect(0,0,0,0)!important;
      white-space:nowrap!important;
      border:0!important;
    }
    @media (max-width:680px){
      body{padding:12px;background:linear-gradient(180deg,#050914 0%,#020306 100%)}
      .panel{padding:14px;border-radius:22px}
      .grid{grid-template-columns:1fr}
      .hero-img{width:min(255px,74vw);max-height:340px;margin-bottom:10px}
      .audio-box{padding:12px;border-radius:18px}
      input,select,textarea{font-size:16px}
      h1{font-size:clamp(23px,7.1vw,32px)}
    }
    @media (max-height:760px) and (min-width:681px){
      .hero-img{width:200px;max-height:250px}
      .panel{padding:18px}
      textarea{min-height:80px}
      h1{font-size:30px}
    }
  </style>

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Service",
    "name":"Get Recommended by AI and Ranked on Google",
    "provider":{"@type":"Organization","name":"Kronatrix","url":"https://kronatrix.co.uk/"},
    "description":"Kronatrix reviews what a business already has, figures out what needs fixing, and recommends the right website, supporting pages, authority sites or visibility build."
  }
  </script>
</head>
<body>
  <main class="wrap">
    <section class="panel" aria-labelledby="main-title">
      <div class="brand">
        <picture>
          <source srcset="kronatrix-ai-logo.webp" type="image/webp" />
          <img src="kronatrix-ai-logo.png" alt="Kronatrix logo" width="40" height="40" />
        </picture>
        <span>Kronatrix</span>
      </div>

      <picture>
        <source srcset="spencer-aurelius.webp" type="image/webp" />
        <img class="hero-img" src="spencer-aurelius.png" alt="Spencer Aurelius, Kronatrix mascot" width="1080" height="1920" fetchpriority="high" />
      </picture>

      <div class="audio-box">
        <h1 id="main-title">Get Recommended by AI & Ranked on Google</h1>
        <p class="micro">Listen first, then send what you have below.</p>
        <audio controls preload="metadata" controlslist="nodownload">
          <source src="kronatrix-audio.mp3" type="audio/mpeg" />
          Your browser does not support the audio element.
        </audio>
      </div>

      <form id="leadForm" action="https://formspree.io/f/mdavwryk" method="POST">
        <input type="hidden" name="_subject" value="Paid Kronatrix AI & Google Visibility Lead" />
        <input type="hidden" name="service" value="Get Recommended by AI and Ranked on Google" />
        <input class="hidden" type="text" name="_gotcha" tabindex="-1" autocomplete="off" />

        <p class="form-note">Do not worry if you do not know every answer. Send what you have. If you are unsure, write “not sure” and Kronatrix will figure out what needs fixing.</p>

        <div class="grid">
          <label class="sr-only" for="name">Your name</label>
          <input id="name" name="name" autocomplete="name" placeholder="Your name" required />

          <label class="sr-only" for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required />
        </div>

        <div class="grid">
          <label class="sr-only" for="business">Business or brand name</label>
          <input id="business" name="business_brand_name" placeholder="Business / brand name" />

          <label class="sr-only" for="website">Website link</label>
          <input id="website" name="website_link" type="url" inputmode="url" placeholder="Website link, if you have one" />
        </div>

        <div class="grid">
          <label class="sr-only" for="phone">Phone or WhatsApp</label>
          <input id="phone" name="phone_or_whatsapp" inputmode="tel" autocomplete="tel" placeholder="Phone / WhatsApp" />

          <label class="sr-only" for="need">What do you think you need?</label>
          <select id="need" name="what_they_think_they_need">
            <option value="" selected>What do you think you need?</option>
            <option>I do not know — tell me what needs fixing</option>
            <option>New main website</option>
            <option>Improve my current website</option>
            <option>Supporting authority sites</option>
            <option>AI & Google visibility build</option>
            <option>More leads from Google</option>
            <option>Better chance of AI recommendations</option>
          </select>
        </div>

        <label class="sr-only" for="details">Links and details</label>
        <textarea id="details" name="links_goals_and_details" placeholder="Paste any links you have: website, social media, Google profile, competitors, or what you want help with. It is okay if you do not know — just write ‘not sure’ and tell us what you can." required></textarea>

        <label class="consent">
          <input type="checkbox" name="permission_to_contact" value="yes" required />
          <span>I agree that Kronatrix can review my details and contact me about what needs fixing and what can be built.</span>
        </label>

        <button class="cta" type="submit">Help Me Get Recommended</button>
        <div class="status" id="formStatus" aria-live="polite"></div>
      </form>
    </section>

    <footer>
      Powered by <a href="https://kronatrix.co.uk/" rel="noopener">KRONATRIX</a>
    </footer>
  </main>

  <script>
    const form = document.getElementById('leadForm');
    const status = document.getElementById('formStatus');

    form.addEventListener('submit', async function(event){
      if (!window.fetch) return;
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      const original = button.textContent;
      button.disabled = true;
      button.textContent = 'Sending...';
      status.textContent = '';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          form.reset();
          status.textContent = 'Sent. Kronatrix will review what you sent and contact you with the next step.';
          button.textContent = 'Request Sent';
        } else {
          status.textContent = 'Please check your details and try again.';
          button.disabled = false;
          button.textContent = original;
        }
      } catch (error) {
        status.textContent = 'Connection issue. Please try again.';
        button.disabled = false;
        button.textContent = original;
      }
    });
  </script>
</body>
</html>
